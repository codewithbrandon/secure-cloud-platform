# =============================================================================
# PROMETHEUS CONFIGURATION
# =============================================================================
# Prometheus collects and stores metrics for:
# - Application performance monitoring
# - Security anomaly detection
# - Infrastructure health tracking
# - Alerting on suspicious patterns
#
# Security Relevance:
# - Detect unusual traffic patterns (potential attacks)
# - Monitor authentication failures (brute force detection)
# - Track resource exhaustion (DoS indicators)
# - Alert on pod crashes (potential exploitation)
#
# Enterprise Relevance:
# - SLA monitoring and reporting
# - Capacity planning
# - Incident response metrics
# - Compliance reporting (uptime, availability)
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    # Global configuration
    global:
      scrape_interval: 15s      # Scrape targets every 15 seconds
      evaluation_interval: 15s   # Evaluate rules every 15 seconds
      scrape_timeout: 10s

      # Attach these labels to any time series or alerts
      external_labels:
        cluster: 'secure-cloud-platform'
        environment: 'production'

    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    # Load rules once and periodically evaluate them
    rule_files:
      - /etc/prometheus/rules/*.yml

    # Scrape configurations
    scrape_configs:
      # =========================================================================
      # PROMETHEUS SELF-MONITORING
      # =========================================================================
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # =========================================================================
      # KUBERNETES API SERVER
      # =========================================================================
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # =========================================================================
      # KUBERNETES NODES (kubelet)
      # =========================================================================
      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # =========================================================================
      # KUBERNETES PODS (Application Metrics)
      # =========================================================================
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods with prometheus.io/scrape annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Use custom port if specified
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
          # Use custom path if specified
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Add pod labels
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          # Add namespace label
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          # Add pod name label
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # =========================================================================
      # KUBERNETES SERVICES
      # =========================================================================
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

      # =========================================================================
      # SECURE-API APPLICATION
      # =========================================================================
      - job_name: 'secure-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - secure-app
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: secure-api
          - source_labels: [__address__]
            action: replace
            target_label: __address__
            regex: (.+):.*
            replacement: ${1}:8080

  # =============================================================================
  # ALERTING RULES
  # =============================================================================
  alerts.yml: |
    groups:
      # =========================================================================
      # APPLICATION ALERTS
      # =========================================================================
      - name: application
        rules:
          # High error rate - potential attack or bug
          - alert: HighErrorRate
            expr: |
              sum(rate(flask_http_request_total{status=~"5.."}[5m])) /
              sum(rate(flask_http_request_total[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
              category: security
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 5% for the last 5 minutes"
              runbook: "https://wiki/runbooks/high-error-rate"

          # Slow response time - potential DoS or resource exhaustion
          - alert: SlowResponseTime
            expr: |
              histogram_quantile(0.95,
                sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)
              ) > 1
            for: 5m
            labels:
              severity: warning
              category: performance
            annotations:
              summary: "Slow response time detected"
              description: "95th percentile response time is above 1 second"

      # =========================================================================
      # KUBERNETES ALERTS
      # =========================================================================
      - name: kubernetes
        rules:
          # Pod crash loop - potential exploitation or instability
          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total[15m]) > 0.5
            for: 5m
            labels:
              severity: critical
              category: security
            annotations:
              summary: "Pod is crash looping"
              description: "Pod {{ $labels.pod }} is restarting frequently"
              runbook: "https://wiki/runbooks/pod-crashloop"

          # High CPU usage - potential cryptomining or DoS
          - alert: HighCPUUsage
            expr: |
              sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod) /
              sum(kube_pod_container_resource_limits{resource="cpu"}) by (pod) > 0.9
            for: 10m
            labels:
              severity: warning
              category: security
            annotations:
              summary: "High CPU usage detected"
              description: "Pod {{ $labels.pod }} CPU usage is above 90%"

          # High memory usage - potential memory leak or attack
          - alert: HighMemoryUsage
            expr: |
              sum(container_memory_usage_bytes{container!=""}) by (pod) /
              sum(kube_pod_container_resource_limits{resource="memory"}) by (pod) > 0.9
            for: 10m
            labels:
              severity: warning
              category: performance
            annotations:
              summary: "High memory usage detected"
              description: "Pod {{ $labels.pod }} memory usage is above 90%"

          # Pod not ready - deployment issues
          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{condition="true"} == 0
            for: 5m
            labels:
              severity: warning
              category: availability
            annotations:
              summary: "Pod is not ready"
              description: "Pod {{ $labels.pod }} has been not ready for 5 minutes"

      # =========================================================================
      # SECURITY ALERTS
      # =========================================================================
      - name: security
        rules:
          # Unusual request rate - potential DDoS
          - alert: UnusualRequestRate
            expr: |
              sum(rate(flask_http_request_total[1m])) > 1000
            for: 2m
            labels:
              severity: critical
              category: security
            annotations:
              summary: "Unusual request rate detected"
              description: "Request rate exceeds 1000 req/min - potential DDoS"

          # Failed authentication attempts (if implemented)
          - alert: HighAuthFailureRate
            expr: |
              sum(rate(auth_failures_total[5m])) > 10
            for: 5m
            labels:
              severity: warning
              category: security
            annotations:
              summary: "High authentication failure rate"
              description: "More than 10 auth failures per minute - potential brute force"
