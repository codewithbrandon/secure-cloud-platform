# =============================================================================
# GRAFANA DEPLOYMENT
# =============================================================================
# Production-grade Grafana deployment for visualization and alerting.
#
# ConfigMaps referenced here are defined in separate files:
#   monitoring/grafana-provisioning.yaml      → grafana-datasources, grafana-dashboard-providers
#   monitoring/grafana-security-dashboard.yaml → grafana-security-dashboard
#
# Security Relevance:
# - Centralized visibility into system health
# - Security dashboards for threat detection
# - Alert notifications for incident response
#
# Enterprise Relevance:
# - Executive dashboards for SLA reporting
# - Operational dashboards for DevOps
# - Security dashboards for SOC teams
# =============================================================================

# Grafana admin password — base64-encoded "admin" (CHANGE IN PRODUCTION)
# Recommended: replace with SealedSecret or external secret operator reference.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: monitoring
type: Opaque
data:
  admin-password: YWRtaW4=

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472

      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          env:
            # Security: Disable anonymous access
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Security: Disable sign-up
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Admin password from secret
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-password
            # Alerting configuration
            - name: GF_ALERTING_ENABLED
              value: "true"
            # Logging
            - name: GF_LOG_MODE
              value: "console"
            - name: GF_LOG_LEVEL
              value: "info"
            # Auto-provisioning root: Grafana loads datasources and dashboard
            # providers from subdirectories of this path at startup.
            - name: GF_PATHS_PROVISIONING
              value: "/etc/grafana/provisioning"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 3000
              name: http

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            # Datasource auto-provisioning (grafana-provisioning.yaml)
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            # Dashboard provider config (grafana-provisioning.yaml)
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            # Dashboard JSON files (grafana-security-dashboard.yaml)
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            # Persistent storage for SQLite DB, sessions, plugins
            - name: storage
              mountPath: /var/lib/grafana

      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-security-dashboard
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-data

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http
