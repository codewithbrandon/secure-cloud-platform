# =============================================================================
# GRAFANA INGRESS
# =============================================================================
# Exposes the Grafana dashboard externally via NGINX Ingress Controller.
# Matches the security posture of k8s/ingress.yaml:
#   - TLS termination with forced HTTPS redirect
#   - Security response headers
#   - Rate limiting to deter scraping / brute force on Grafana login
#   - Request size caps
#   - Sensible proxy timeouts
#
# Pre-requisites:
#   - NGINX Ingress Controller deployed in the ingress-nginx namespace
#   - TLS certificate stored in Secret `grafana-tls` in the monitoring namespace
#     (create via cert-manager or manually: kubectl create secret tls grafana-tls ...)
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app: grafana
  annotations:
    kubernetes.io/ingress.class: nginx

    # -------------------------------------------------------------------------
    # TLS / SSL
    # -------------------------------------------------------------------------
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"

    # -------------------------------------------------------------------------
    # SECURITY HEADERS
    # Grafana uses inline styles and scripts, so CSP must allow 'unsafe-inline'.
    # -------------------------------------------------------------------------
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------------------------
    # RATE LIMITING — protect the login page from brute force
    # -------------------------------------------------------------------------
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # -------------------------------------------------------------------------
    # REQUEST SIZE & TIMEOUTS
    # -------------------------------------------------------------------------
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # -------------------------------------------------------------------------
    # BACKEND
    # -------------------------------------------------------------------------
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/health-check-path: "/api/health"

spec:
  tls:
    - hosts:
        - grafana.securecloud.example.com
      secretName: grafana-tls

  rules:
    - host: grafana.securecloud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
