# Demo deployment using nginx to verify infrastructure
apiVersion: v1
kind: Namespace
metadata:
  name: secure-app
  labels:
    environment: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-api
  namespace: secure-app
  labels:
    app: secure-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-api
  template:
    metadata:
      labels:
        app: secure-api
    spec:
      containers:
        - name: secure-api
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: secure-api
  namespace: secure-app
spec:
  type: LoadBalancer
  selector:
    app: secure-api
  ports:
    - port: 80
      targetPort: 80
