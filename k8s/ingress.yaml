# =============================================================================
# KUBERNETES INGRESS CONFIGURATION
# =============================================================================
# Ingress exposes HTTP/HTTPS routes from outside the cluster
#
# Architecture Options:
# 1. NGINX Ingress Controller → Internal Load Balancer → Application Gateway
# 2. Application Gateway Ingress Controller (AGIC) direct integration
#
# This configuration uses NGINX Ingress Controller for flexibility
# Application Gateway provides WAF protection at the edge
#
# Security Controls:
# - TLS termination at ingress
# - Rate limiting
# - Request size limits
# - Security headers
# =============================================================================

# =============================================================================
# INGRESS RESOURCE
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-api-ingress
  namespace: secure-app
  labels:
    app: secure-api
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: nginx

    # =========================================================================
    # TLS/SSL CONFIGURATION
    # =========================================================================
    # Redirect HTTP to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # TLS configuration
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"

    # =========================================================================
    # SECURITY HEADERS
    # =========================================================================
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'" always;

    # =========================================================================
    # RATE LIMITING
    # =========================================================================
    # Protect against DDoS and brute force attacks
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "5"

    # =========================================================================
    # REQUEST SIZE LIMITS
    # =========================================================================
    # Prevent large payload attacks
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"

    # =========================================================================
    # TIMEOUTS
    # =========================================================================
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"

    # =========================================================================
    # BACKEND CONFIGURATION
    # =========================================================================
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

    # Health check configuration
    nginx.ingress.kubernetes.io/health-check-path: "/health"

spec:
  # TLS configuration
  tls:
    - hosts:
        - api.securecloud.example.com
      secretName: tls-secret  # Created separately with cert

  rules:
    - host: api.securecloud.example.com
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: secure-api
                port:
                  number: 80

          # Health check route (allow without rate limiting)
          - path: /health
            pathType: Exact
            backend:
              service:
                name: secure-api
                port:
                  number: 80

          # Metrics route (internal access only ideally)
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: secure-api
                port:
                  number: 80

---
# =============================================================================
# INGRESS CLASS
# =============================================================================
# Defines the ingress controller implementation
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx
