# =============================================================================
# KUBERNETES SERVICE ACCOUNT WITH WORKLOAD IDENTITY
# =============================================================================
# Enables Azure AD authentication for pods without storing credentials
#
# Security Implementation:
# - Workload Identity Federation (replaces AAD Pod Identity)
# - No secrets stored in cluster
# - Short-lived tokens with automatic rotation
# - Azure RBAC for fine-grained access control
#
# Enterprise Relevance:
# - Zero Trust: No long-lived credentials
# - Audit trail: All access logged in Azure AD
# - Least privilege: Specific permissions per workload
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-api-sa
  namespace: secure-app
  labels:
    app: secure-api
  annotations:
    # Workload Identity annotation - links to Azure managed identity
    # Replace with actual client ID after Terraform deployment
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"

---
# =============================================================================
# CLUSTER ROLE BINDING FOR SERVICE ACCOUNT
# =============================================================================
# Grants minimal permissions within the namespace
# Following principle of least privilege
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secure-api-role
  namespace: secure-app
rules:
  # Allow reading ConfigMaps (for application configuration)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading Secrets (for application secrets)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secure-api-rolebinding
  namespace: secure-app
subjects:
  - kind: ServiceAccount
    name: secure-api-sa
    namespace: secure-app
roleRef:
  kind: Role
  name: secure-api-role
  apiGroup: rbac.authorization.k8s.io
