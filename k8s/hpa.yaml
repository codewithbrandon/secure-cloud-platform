# =============================================================================
# HORIZONTAL POD AUTOSCALER
# =============================================================================
# Automatically scales the number of pod replicas based on metrics
#
# Security Relevance:
# - Handles traffic spikes (potential DDoS mitigation)
# - Maintains availability under load
# - Resource optimization reduces attack surface
#
# Enterprise Relevance:
# - Cost optimization through automatic scaling
# - SLA compliance through capacity management
# - Resilience against traffic spikes
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secure-api-hpa
  namespace: secure-app
  labels:
    app: secure-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secure-api

  # Replica limits
  minReplicas: 2   # Minimum for high availability
  maxReplicas: 10  # Maximum to prevent runaway scaling

  # Scaling metrics
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Scale up when CPU > 70%

    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Scale up when memory > 80%

  # Scaling behavior
  behavior:
    # Scale up quickly to handle traffic spikes
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 60s before scaling up again
      policies:
        - type: Percent
          value: 100  # Can double replicas
          periodSeconds: 60
        - type: Pods
          value: 4    # Or add up to 4 pods
          periodSeconds: 60
      selectPolicy: Max  # Use whichever allows more scaling

    # Scale down slowly to prevent flapping
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 25   # Remove 25% of pods
          periodSeconds: 120
        - type: Pods
          value: 1    # Or remove 1 pod
          periodSeconds: 120
      selectPolicy: Min  # Use whichever removes fewer pods
